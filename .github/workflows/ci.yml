name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate the knowledge base
        run: npm run validate
      - name: Coverage report is up to date
        run: |
          npm run stats
          git diff --exit-code -- kb/admin/stats.json kb/admin/COVERAGE.md
